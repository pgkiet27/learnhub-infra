provider:
  name: aws

sources:
  - ingress

domainFilters:
  - learnhub-edu.site

policy: sync
registry: txt
txtOwnerId: learnhub-prod

serviceAccount:
  create: true
  name: external-dns

env:
  - name: AWS_DEFAULT_REGION
    value: ap-southeast-1

resources:
  requests:
    cpu: 20m
    memory: 64Mi