apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-service-db
  namespace: learnhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ai-service-db
    template:
      engineVersion: v2
      data:
        DB_USER: "{{ .DB_USER }}"
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
        DATABASE_URL: "postgresql://{{ .DB_USER }}:{{ .DB_PASSWORD }}@postgres:5432/ai_db?sslmode=require"
  dataFrom:
    - extract:
        key: learnhub/prod/db/ai