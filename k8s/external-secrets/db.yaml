apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-master
  namespace: learnhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rds-master
  dataFrom:
    - extract:
        key: learnhub/prod/db/master
