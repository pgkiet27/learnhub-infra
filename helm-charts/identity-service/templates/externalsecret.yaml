{{- if .Values.appSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-app
  namespace: learnhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Release.Name }}-app
  dataFrom:
    - extract:
        key: learnhub/prod/app/{{ .Release.Name }}
{{- end }}
