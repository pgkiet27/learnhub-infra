replicaCount: 2

image:
  repository: 084828583507.dkr.ecr.ap-southeast-1.amazonaws.com/learnhub/course-service

resources:
  requests:
    cpu: 150m
    memory: 320Mi
  limits:
    cpu: 1000m
    memory: 640Mi

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 10
  failureThreshold: 30

env:
  SPRING_PROFILES_ACTIVE: "production"
  DB_URL: "jdbc:postgresql://postgres:5432/course_db?sslmode=require"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  JAEGER_ENDPOINT: "http://jaeger:4318/v1/traces"
  AWS_REGION: "ap-southeast-1"
  AWS_PROFILE: ""
  AWS_S3_BUCKET: "learnhub-media-084828583507"

secretNames:
  - learnhub-shared-secrets
  - course-service-db

serviceMonitor:
  enabled: true
