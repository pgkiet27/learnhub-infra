replicaCount: 2

image:
  repository: 084828583507.dkr.ecr.ap-southeast-1.amazonaws.com/learnhub/enrollment-service

resources:
  requests:
    cpu: 150m
    memory: 320Mi
  limits:
    cpu: 1000m
    memory: 640Mi

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 10
  failureThreshold: 30

env:
  SPRING_PROFILES_ACTIVE: "production"
  DB_URL: "jdbc:postgresql://postgres:5432/enrollment_db?sslmode=require"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  JAEGER_ENDPOINT: "http://jaeger:4318/v1/traces"
  COURSE_SERVICE_URL: "http://course-service:8083"
  IDENTITY_SERVICE_URL: "http://identity-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  AI_SERVICE_URL: "http://ai-service:8000"
  ASSESSMENT_SERVICE_URL: "http://assessment-service:8087"
  CHURN_EXPORT_ENABLED: "true"
  CHURN_EXPORT_BUCKET: "learnhub-ml-084828583507"
  CHURN_EXPORT_PREFIX: "churn"
  AWS_REGION: "ap-southeast-1"
  AWS_PROFILE: ""

secretNames:
  - learnhub-shared-secrets
  - enrollment-service-db

serviceMonitor:
  enabled: true
