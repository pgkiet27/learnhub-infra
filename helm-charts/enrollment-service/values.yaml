# Default values — can override when deploy
# >1 is safe: the churn job holds a ShedLock lock (table shedlock in enrollment_db)
replicaCount: 1

image:
  repository: pgkiet27/learnhub-enrollment  # image name (will change to ECR URL when in production)
  tag: latest                    # Tag will be updated by CI/CD to git SHA
  pullPolicy: IfNotPresent       # IfNotPresent: only pull if not in node

service:
  type: ClusterIP  # ClusterIP: only accessible in cluster
  port: 8084

resources:
  requests:         # Minimum resources K8s needs reserve for pod
    memory: "256Mi"
    cpu: "250m"     # 250m = 0.25 CPU core
  limits:           # Maximum resources pod can use
    memory: "512Mi"
    cpu: "500m"

env:
  # this is placeholder — real value put in Secret or ConfigMap
  SPRING_PROFILES_ACTIVE: "production"
  DB_URL: "jdbc:postgresql://enrollment-db:5432/enrollment_db"
  RABBITMQ_HOST: "rabbitmq"
  REDIS_HOST: "redis"
  IDENTITY_SERVICE_URL: "http://identity-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  AI_SERVICE_URL: "http://ai-service:8000"
  ASSESSMENT_SERVICE_URL: "http://assessment-service:8087"
  # Churn dataset export; enabling it needs an IRSA role with s3:PutObject on <bucket>/churn/*
  CHURN_EXPORT_ENABLED: "false"
  CHURN_EXPORT_BUCKET: "learnhub-ml-abc123"
  AWS_REGION: "us-east-1"

# Health check config — K8s used to monitor pod
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8084
  initialDelaySeconds: 60  # Wait 60s after start before beginning checks
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8084
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3