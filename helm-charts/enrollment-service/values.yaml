# Default values — can override when deploy
# >1 is safe: the churn job holds a ShedLock lock (table shedlock in enrollment_db)
replicaCount: 1

image:
  repository: pgkiet27/learnhub-enrollment  # image name (will change to ECR URL when in production)
  tag: e20ae1e81937b59ce3a590cb68bec9d4bcf5c640
  pullPolicy: IfNotPresent       # IfNotPresent: only pull if not in node

service:
  type: ClusterIP  # ClusterIP: only accessible in cluster
  port: 8084

resources:
  requests:         # Minimum resources K8s needs reserve for pod
    memory: "256Mi"
    cpu: "250m"     # 250m = 0.25 CPU core
  limits:           # Maximum resources pod can use
    memory: "512Mi"
    cpu: "500m"

env:
  # this is placeholder — real value put in Secret or ConfigMap
  SPRING_PROFILES_ACTIVE: "production"
  DB_URL: "jdbc:postgresql://enrollment-db:5432/enrollment_db"
  RABBITMQ_HOST: "rabbitmq"
  REDIS_HOST: "redis"
  IDENTITY_SERVICE_URL: "http://identity-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  AI_SERVICE_URL: "http://ai-service:8000"
  ASSESSMENT_SERVICE_URL: "http://assessment-service:8087"
  # Churn dataset export; on EKS the Pod Identity role (terraform pod_identity.tf) grants s3:PutObject on <bucket>/churn/*
  CHURN_EXPORT_ENABLED: "false"
  CHURN_EXPORT_BUCKET: "learnhub-ml-084828583507"
  CHURN_EXPORT_PREFIX: "churn/dev"
  AWS_REGION: "ap-southeast-1"

# Health check config — K8s used to monitor pod
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8084
  initialDelaySeconds: 60  # Wait 60s after start before beginning checks
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8084
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

secretNames: []

appSecret:
  enabled: false

ingress:
  enabled: false

serviceMonitor:
  enabled: false
  path: /actuator/prometheus

startupProbe: {}

# HorizontalPodAutoscaler: when enabled the Deployment leaves replicas to the HPA (minReplicas..maxReplicas)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70   # percent of resources.requests.cpu
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 minutes of low load before removing pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
