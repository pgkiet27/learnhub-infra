replicaCount: 2

image:
  repository: 084828583507.dkr.ecr.ap-southeast-1.amazonaws.com/learnhub/ai-service

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 18

env:
  DATABASE_URL: null
  COURSE_DB_URL: null
  LLM_PROVIDER: "gemini"
  EMBEDDING_MODEL: "gemini-embedding-001"
  GEMINI_MODEL: "gemini-2.5-flash"
  TOP_K_RESULTS: "3"
  ENROLLMENT_SERVICE_URL: "http://enrollment-service:8084"
  ENROLLMENT_CHECK_ENABLED: "true"
  # Pod Identity (terraform pod_identity.tf) grants sagemaker:InvokeEndpoint on this endpoint only
  CHURN_MODEL_BACKEND: "sagemaker"
  CHURN_SAGEMAKER_ENDPOINT: "learnhub-churn"
  AWS_REGION: "ap-southeast-1"

secretNames:
  - ai-service-db
  - ai-service-app

appSecret:
  enabled: true

autoscaling:
  enabled: true
