# Default values — can override when deploy
replicaCount: 1

image:
  repository: pgkiet27/learnhub-notification  # image name (will change to ECR URL when in production)
  tag: 2db2e1444bc6302c527b112f20f76effc1c15eae
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8086

resources:
  requests:
    memory: "192Mi"
    cpu: "100m"
  limits:
    memory: "384Mi"
    cpu: "300m"

env:
  # this is placeholder — real value put in Secret or ConfigMap (SMTP credentials especially)
  SPRING_PROFILES_ACTIVE: "production"
  RABBITMQ_HOST: "rabbitmq"
  IDENTITY_SERVICE_URL: "http://identity-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  FRONTEND_URL: "https://learnhub-edu.site"
  MAIL_HOST: "email-smtp.ap-southeast-1.amazonaws.com"  # Amazon SES SMTP endpoint
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_STARTTLS: "true"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8086
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8086
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

secretNames: []

appSecret:
  enabled: false

ingress:
  enabled: false

serviceMonitor:
  enabled: false
  path: /actuator/prometheus

startupProbe: {}

# HorizontalPodAutoscaler: when enabled the Deployment leaves replicas to the HPA (minReplicas..maxReplicas)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70   # percent of resources.requests.cpu
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 minutes of low load before removing pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
