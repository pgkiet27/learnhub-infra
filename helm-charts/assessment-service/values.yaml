# Default values — can override when deploy
replicaCount: 1

image:
  repository: pgkiet27/learnhub-assessment  # image name (will change to ECR URL when in production)
  tag: latest                    # Tag will be updated by CI/CD to git SHA
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8087

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

env:
  # this is placeholder — real value put in Secret or ConfigMap
  SPRING_PROFILES_ACTIVE: "production"
  DB_URL: "jdbc:postgresql://assessment-db:5432/assessment_db"
  COURSE_SERVICE_URL: "http://course-service:8083"
  ENROLLMENT_SERVICE_URL: "http://enrollment-service:8084"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8087
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8087
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
