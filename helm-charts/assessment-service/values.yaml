# Default values — can override when deploy
replicaCount: 1

image:
  repository: pgkiet27/learnhub-assessment  # image name (will change to ECR URL when in production)
  tag: e20ae1e81937b59ce3a590cb68bec9d4bcf5c640
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8087

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

env:
  # this is placeholder — real value put in Secret or ConfigMap
  SPRING_PROFILES_ACTIVE: "production"
  DB_URL: "jdbc:postgresql://assessment-db:5432/assessment_db"
  COURSE_SERVICE_URL: "http://course-service:8083"
  ENROLLMENT_SERVICE_URL: "http://enrollment-service:8084"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8087
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8087
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

secretNames: []

appSecret:
  enabled: false

ingress:
  enabled: false

serviceMonitor:
  enabled: false
  path: /actuator/prometheus

startupProbe: {}

# HorizontalPodAutoscaler: when enabled the Deployment leaves replicas to the HPA (minReplicas..maxReplicas)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70   # percent of resources.requests.cpu
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 minutes of low load before removing pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
