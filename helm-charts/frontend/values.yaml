replicaCount: 1

image:
  repository: pgkiet27/learnhub-frontend
  tag: 9ec16bacb072fa319846b5a47401d8e24fdaf53e-6-1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    memory: "192Mi"
    cpu: "100m"
  limits:
    memory: "384Mi"
    cpu: "500m"

env:
  API_URL: "http://api-gateway:8080"

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

secretNames: []

appSecret:
  enabled: false

ingress:
  enabled: false

serviceMonitor:
  enabled: false
  path: /metrics

startupProbe: {}

# HorizontalPodAutoscaler: when enabled the Deployment leaves replicas to the HPA (minReplicas..maxReplicas)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70   # percent of resources.requests.cpu
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 minutes of low load before removing pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
